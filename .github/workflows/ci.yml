name: cross-platform conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python:
          - "3.10"
          - "3.12"
          - "3.14"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install project and development tooling
        run: python -m pip install -e ".[dev]"

      - name: Verify installed dependency consistency
        run: python -m pip check

      - name: Run unit and integration tests
        run: python -X dev -m pytest -q -W error

      - name: Run Ruff
        run: python -m ruff check src tests examples platform_conformance tools

      - name: Run mypy
        run: python -m mypy src platform_conformance tools

      - name: Compile Python sources
        run: python -m compileall -q src tests examples platform_conformance tools

      - name: Build source and wheel distributions
        run: python -m build

      - name: Run deterministic conformance profile
        run: >-
          python -m platform_conformance --profile ci
          --json conformance-${{ runner.os }}-py${{ matrix.python }}.json

      - name: Upload conformance report
        uses: actions/upload-artifact@v7
        with:
          name: conformance-${{ runner.os }}-py${{ matrix.python }}
          path: conformance-${{ runner.os }}-py${{ matrix.python }}.json
          if-no-files-found: error
